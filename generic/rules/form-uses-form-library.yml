id: form-uses-form-library
language: Tsx
severity: error
message: A plain <form> needs React Hook Form in the same file.
note: |
  Build forms with react-hook-form and its Zod resolver, so validation and error display behave the same
  everywhere (install both with the first form). React Router's <Form> stays allowed for actions with no
  client-side validation. See docs/design/architecture.md.
files:
  - client/src/**/*.tsx
ignores:
  - '**/*.test.*'
rule:
  any:
    - pattern: <form $$$ATTRS>$$$CHILDREN</form>
    - pattern: <form $$$ATTRS />
  inside:
    stopBy: end
    kind: program
    not:
      has:
        stopBy: end
        kind: import_statement
        regex: react-hook-form
