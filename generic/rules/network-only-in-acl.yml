id: network-only-in-acl
language: Tsx
severity: error
message: Only client/src/acl/ makes network calls or names an /api/ path.
note: |
  Every request goes through the functions in client/src/acl/, which route loaders call so that every fetch
  a page needs starts in parallel before it renders. A fetch elsewhere starts late and invites request
  waterfalls. See docs/design/data-loading.md.
files:
  - client/src/**/*.ts
  - client/src/**/*.tsx
ignores:
  - client/src/acl/**
  - client/src/**/*.test.*
rule:
  any:
    - pattern: fetch($$$)
    - pattern: window.fetch($$$)
    - pattern: globalThis.fetch($$$)
    - pattern: new XMLHttpRequest($$$)
    - pattern: new EventSource($$$)
    - kind: string
      regex: ^['"]/api/
    - kind: template_string
      regex: ^`/api/
    - kind: import_statement
      has:
        field: source
        regex: ^['"](axios|ky|got|superagent|ofetch|node-fetch|undici|redaxios|wretch)(/.*)?['"]$
