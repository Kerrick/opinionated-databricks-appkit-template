id: appkit-data-hooks-only-in-acl
language: Tsx
severity: error
message: Only client/src/acl/ calls AppKit's data hooks.
note: |
  AppKit's hooks return the warehouse's row types. The anti-corruption layer wraps each one in a hook named
  use<Concept> that returns domain objects, so views never see the warehouse's model. See
  docs/design/architecture.md.
files:
  - client/src/**/*.ts
  - client/src/**/*.tsx
ignores:
  - client/src/acl/**
  - client/src/components/charts/**
  - client/src/**/*.test.*
rule:
  kind: import_specifier
  has:
    field: name
    # Every hook in @databricks/appkit-ui (react and react/beta) that requests data from the server, as of the
    # pinned version. Hooks that read only local state or the boot-time config (useIsMobile, usePluginClientConfig,
    # useResourceStatus, useDesignReady) stay open to views.
    regex: ^(useAnalyticsQuery|useMetricView|useChartData|useAgentChat|useGenieChat|useServingInvoke|useServingStream|useAiSearchQuery|useDatabase(Create|Delete|List|Mutation|Query|Record|Update))$
  inside:
    stopBy: end
    kind: import_statement
    has:
      field: source
      regex: appkit-ui
