id: express-async-handler-wrapped
language: Tsx
severity: error
message: An async route handler must go through asyncHandler.
note: |
  AppKit runs Express 4, which does not pass a rejected promise to the error middleware, so a throw inside
  an async handler would leave the request hanging. Write `app.get(path, asyncHandler(async (req, res) => {...}))`
  with asyncHandler from server/async-handler.ts. See the server side of docs/design/architecture.md.
files:
  - server/**/*.ts
ignores:
  - '**/*.test.*'
rule:
  any:
    - kind: arrow_function
    - kind: function_expression
  regex: ^async\b
  inside:
    kind: arguments
    stopBy: neighbor
    inside:
      stopBy: neighbor
      pattern: $APP.$METHOD($$$ARGS)
constraints:
  METHOD:
    regex: ^(get|post|put|patch|delete|all)$
