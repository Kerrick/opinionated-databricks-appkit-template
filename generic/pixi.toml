# The shared libraries Chromium needs on Linux, from conda-forge, so that the
# browser tests need no system packages and no root. `pnpm test` installs them
# into .pixi/ through tools/install-browsers.ts, and only the browser sees them
# (tools/browser-libraries.ts). macOS and Windows don't use this file.
#
# The list is what Playwright's headless Chromium links against, beyond glibc:
# `readelf -d` on the browser binary names them. Add a package here when a
# Playwright upgrade makes the browser report another missing library.

[workspace]
name = "browser-libraries"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]
requires-pixi = ">=0.84.2"

[dependencies]
alsa-lib = "==1.2.16.1"
at-spi2-atk = "==2.38.0"
at-spi2-core = "==2.40.3"
"atk-1.0" = "==2.38.0"
dbus = "==1.16.2"
libexpat = "==2.9.0"
libgbm = "==1.1.2"
libglib = "==2.90.1"
libudev1 = "==262.2"
libxcb = "==1.17.0"
libxkbcommon = "==1.13.2"
nspr = "==4.41"
nss = "==3.118"
xorg-libx11 = "==1.8.14"
xorg-libxcomposite = "==0.4.7"
xorg-libxdamage = "==1.1.6"
xorg-libxext = "==1.3.7"
xorg-libxfixes = "==6.0.2"
xorg-libxrandr = "==1.5.5"
