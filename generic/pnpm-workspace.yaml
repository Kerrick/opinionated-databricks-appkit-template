packages:
  - '.'

overrides:
  vite: npm:rolldown-vite@7.1.14
  '@opentelemetry/core': 2.12.0
  systeminformation: 5.33.16
  fast-uri: 3.1.0
  socks: 2.8.7
  bare-path: 3.1.1
  bare-url: 2.5.2

allowBuilds:
  '@ast-grep/napi': true
  esbuild: true
  '@databricks/appkit': true
  '@databricks/appkit-ui': true
  protobufjs: true

# With pnpm's side-effects cache, a second install from a warm store drops the
# dependencies that @databricks/appkit bundles inside its package. Importing
# @databricks/appkit then throws "Cannot find package
# '@databricks/sdk-statementexecution'" (which is how `pnpm run test` failed).
# Building such packages again on every install avoids that.
sideEffectsCache: false
