# Structural rules for one file at a time. `pnpm run lint:structure` scans the project; the rules'
# own tests live in rule-tests/ and run first, so a rule that stops matching is caught.
ruleDirs:
  - rules
testConfigs:
  - testDir: rule-tests
# Rules are written for Tsx, which also parses plain TypeScript. ast-grep picks a file's language by its extension,
# so without this every rule silently skipped .ts files (the server, hooks and acl/ code).
languageGlobs:
  tsx:
    - '*.ts'
